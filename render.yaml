# Blueprint de despliegue en Render para el backend (Spring Boot + Docker).
#
# Uso: en render.com -> New -> Blueprint -> conectar este repositorio.
# Render detecta este archivo y crea el servicio web automaticamente.
#
# La base de datos PostgreSQL se crea por separado (Render -> New -> PostgreSQL,
# plan free). Con los datos que Render entrega, arma DB_URL asi:
#   jdbc:postgresql://<hostname_interno>:5432/<database>
# (usa el "Hostname" interno, no la External Database URL, porque el backend
# corre en la misma red de Render que la base de datos).
services:
  - type: web
    name: monitoreo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
