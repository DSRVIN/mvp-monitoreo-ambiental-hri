services:
  # ---- Base de datos PostgreSQL (servicio principal del MVP) ----
  db:
    image: postgres:16-alpine
    container_name: monitoreo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitoreo_db
      POSTGRES_USER: monitoreo
      POSTGRES_PASSWORD: monitoreo123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoreo -d monitoreo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- pgAdmin: cliente web para inspeccionar la BD (opcional) ----
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: monitoreo_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hri.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  # ---- Backend Spring Boot (perfil "full": se compila en Docker, no necesitas Java/Maven local) ----
  backend:
    build: ./backend
    container_name: monitoreo_backend
    restart: unless-stopped
    profiles: ["full"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/monitoreo_db
      DB_USER: monitoreo
      DB_PASSWORD: monitoreo123
      CORS_ORIGINS: "http://localhost:*,http://127.0.0.1:*"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
